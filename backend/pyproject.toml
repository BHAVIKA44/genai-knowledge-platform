[project]
name = "genai-knowledge-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "docling>=2.0,<3",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "sqlmodel>=0.0.22,<1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["filetype", "fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
